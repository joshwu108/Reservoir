[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reservoir"
version = "0.2.0"
description = "Certified Exact Prioritized Experience Replay with Crash Atomicity and Sampling Attestation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=2.2.6",
    "torch>=2.0.0",
    "gymnasium>=1.3.0",
    "matplotlib>=3.10.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.0",
    "pytest-cov>=4.0",
]
atari = [
    "stable-baselines3>=2.9.0",
    "ale-py>=0.9",
    "gymnasium[atari]>=1.0",
    "autorom[accept-rom-license]",
    "matplotlib>=3.7",
]
prefcheck = [
    "trl>=0.11",
    "transformers>=4.40",
    "datasets>=2.18",
    "accelerate>=0.27",
]
anchor = [
    "transformers>=4.40",
    "datasets>=2.18",
    "accelerate>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -v"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "hypothesis>=6.0",
    "pytest-cov>=4.0",
]
